syntax = "proto3";

package license.v1;

option go_package = "github.com/servekit/license-service/gen/license/v1;licenseservicev1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Enums — enums live in proto, DB stores the underlying int32, and the
// int32↔enum cast happens at the store boundary inside the service layer.
// json_name pins the wire names the client contract uses ("downloads",
// "perpetual", ...) for both protojson marshal and unmarshal.
// ─────────────────────────────────────────────────────────────────────────────

// Module is a sellable module. player/storage/sound/environment/settings are
// always free and never enter the entitlement system. The client-facing
// trial/start request carries the module as the lowercase wire name
// ("downloads"/"tools", matching the client contract) and converts at the
// service boundary.
enum Module {
  MODULE_UNSPECIFIED = 0;
  MODULE_DOWNLOADS = 1;
  MODULE_TOOLS = 2;
}

// EntitlementKind is the billing model of an entitlement entry.
enum EntitlementKind {
  ENTITLEMENT_KIND_UNSPECIFIED = 0;
  ENTITLEMENT_KIND_PERPETUAL = 1;
  ENTITLEMENT_KIND_SUBSCRIPTION = 2;
  ENTITLEMENT_KIND_TRIAL = 3;
}

// KeyStatus is the lifecycle state of a license key. Revocation is a soft
// state (rows kept); devices/entitlements survive and slots reattach on
// unrevoke.
enum KeyStatus {
  KEY_STATUS_UNSPECIFIED = 0;
  KEY_STATUS_ACTIVE = 1;
  KEY_STATUS_REVOKED = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Client-facing messages (LicenseService)
// ─────────────────────────────────────────────────────────────────────────────

// Pong is the health-check response — only public, non-sensitive info.
message Pong {
  string service = 1;    // service name, e.g. "license-service"
  string version = 2;    // semantic version (ldflags; "dev" by default)
  string git_commit = 3; // short commit hash (ldflags or VCS-embedded)
  string git_branch = 4; // git branch (ldflags)
  string build_time = 5; // build time, RFC3339 UTC (ldflags)
  string go_version = 6; // Go toolchain version (runtime, not injected)
  string status = 7;     // "SERVING" when serving normally
  int64 now = 8;         // server time, Unix millis
  int64 started_at = 9;  // process start time, Unix millis
}

// ActivateRequest drives the idempotent activation converger: first activate,
// heartbeat, fingerprint rebind, post-purchase refresh, or evict-and-retry.
// Both `key` and `license_key` are accepted (client sends `key`; docs wrote
// `licenseKey`); the server takes the first non-empty one. Key shape is
// validated after normalization in the service (BAD_KEY_FORMAT), so the
// transport only guards length.
message ActivateRequest {
  string key = 1 [(buf.validate.field).string.max_len = 128];
  string license_key = 2 [(buf.validate.field).string.max_len = 128];
  // Device fingerprint, "^v1\." + 64 lowercase hex chars.
  string fingerprint_id = 3 [
    (buf.validate.field).string = {
      pattern: "^v1\\.[0-9a-f]{64}$"
      min_len: 1
      max_len: 128
    }
  ];
  // Stable device identity anchor (never regenerated by the client).
  string device_token = 4 [(buf.validate.field).string.uuid = true];
  // Optional: only sent when retrying after a 409 slot_limit response.
  string evict_device_token = 5 [(buf.validate.field).string.uuid = true];
}

// DeviceSlotInfo describes one device occupying a slot. `name` is reserved
// for a future device-name source; the server never sets it today.
message DeviceSlotInfo {
  string device_token = 1;
  string fingerprint_id = 2;
  google.protobuf.Timestamp first_seen_at = 3;
  google.protobuf.Timestamp last_seen_at = 4;
  optional string name = 5;
}

// SlotSummary reports concurrent-slot usage after activate.
message SlotSummary {
  int32 used = 1;
  int32 max = 2;
  repeated DeviceSlotInfo devices = 3;
}

// ActivateResponse carries the detached-signature cert. `payload` MUST be
// the exact canonical JSON bytes that were signed — the client re-computes
// canonical form and compares byte-for-byte.
message ActivateResponse {
  string payload = 1;   // canonical JSON string (cert v1, see docs/design.md §8)
  string signature = 2; // base64 (standard alphabet, padded) of the 64-byte Ed25519 signature
  SlotSummary slots = 3;
}

// DeactivateRequest releases the caller's own slot (idempotent).
message DeactivateRequest {
  string key = 1 [(buf.validate.field).string.max_len = 128];
  string license_key = 2 [(buf.validate.field).string.max_len = 128];
  string device_token = 3 [(buf.validate.field).string.uuid = true];
}

message DeactivateResponse {
  // false = the device was not in a slot (still a 200).
  bool released = 1;
}

// TrialStartRequest starts (or idempotently resumes) a keyless trial.
// `license_key` optionally merges the trial ledger into a keyed cert.
// module is the lowercase wire name from the client contract ("downloads" /
// "tools"); the service converts it to the Module enum at the boundary.
message TrialStartRequest {
  string module = 1 [
    (buf.validate.field).string = {
      in: ["downloads", "tools"]
      min_len: 1
    }
  ];
  string fingerprint_id = 2 [
    (buf.validate.field).string = {
      pattern: "^v1\\.[0-9a-f]{64}$"
      min_len: 1
      max_len: 128
    }
  ];
  string device_token = 3 [(buf.validate.field).string.uuid = true];
  string license_key = 4 [(buf.validate.field).string.max_len = 128];
}

message TrialStartResponse {
  string payload = 1;
  string signature = 2;
  // true when a trial for (fingerprint_id, module) already existed — the
  // original started_at is reused (reinstalling with a new device_token does
  // NOT reset a trial).
  bool already_started = 3;
}

message HealthRequest {}

message HealthChecks {
  bool db = 1;
  bool signing = 2;
}

// HealthResponse is served at GET /healthz. Any failing check flips the RPC
// to Unavailable (HTTP 503 via the gateway).
message HealthResponse {
  string status = 1;
  HealthChecks checks = 2;
}

// ─────────────────────────────────────────────────────────────────────────────
// Error detail messages — attached to gRPC status details by the error
// interceptor; the future HTTP gateway flattens them into the error body.
// ─────────────────────────────────────────────────────────────────────────────

// SlotLimitInfo accompanies SLOT_LIMIT (409) so the client can render the
// device chooser.
message SlotLimitInfo {
  int32 max_slots = 1;
  repeated DeviceSlotInfo devices = 2;
}

// RetryAfterInfo accompanies RATE_LIMITED (429); the gateway maps it to the
// Retry-After header.
message RetryAfterInfo {
  int32 seconds = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Admin-facing messages (LicenseAdminService)
// {key_id} accepts the licenseId ("lk_" + 32 hex) or the full 64-hex key_hash.
// ─────────────────────────────────────────────────────────────────────────────

// EntitlementInput is one grant entry for CreateKey / GrantModule.
// For subscription/trial: exactly one of duration_days (extend from
// max(now, current expires_at)) or expires_at (absolute override).
// For perpetual: neither may be set.
message EntitlementInput {
  Module module = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  EntitlementKind kind = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  int32 duration_days = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3650
  }];
  google.protobuf.Timestamp expires_at = 4;
}

// EntitlementInfo is the read-side view of one module entitlement.
// perpetual ⇒ expires_at unset; subscription/trial ⇒ expires_at always set.
message EntitlementInfo {
  Module module = 1;
  EntitlementKind kind = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp granted_at = 4;
}

// KeyInfo never contains the plaintext key — only license_id/key_prefix.
message KeyInfo {
  string license_id = 1;
  string key_prefix = 2; // first 8 chars of the normalized key, for support
  string label = 3;
  int32 max_slots = 4;
  int32 used_slots = 5;
  KeyStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp revoked_at = 8;
  repeated EntitlementInfo entitlements = 9;
  repeated DeviceSlotInfo devices = 10; // populated by ShowKey only
}

message CreateKeyRequest {
  string label = 1 [(buf.validate.field).string.max_len = 200];
  // 0 = default 3 slots.
  int32 slots = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
  repeated EntitlementInput grants = 3 [(buf.validate.field).repeated.max_items = 16];
}

message CreateKeyResponse {
  KeyInfo key = 1;
  // Plaintext key, shown exactly once at creation ("AV1D-XXXXX-XXXXX-XXXXX-XXXXX").
  string plaintext_key = 2;
}

message ShowKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message ShowKeyResponse {
  KeyInfo key = 1;
}

message ListKeysRequest {
  // 0/UNSPECIFIED = all statuses.
  KeyStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 500
  }];
}

message ListKeysResponse {
  repeated KeyInfo keys = 1;
}

message UpdateKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string label = 2 [(buf.validate.field).string.max_len = 200];
  optional int32 slots = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
}

message UpdateKeyResponse {
  KeyInfo key = 1;
}

message RevokeKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  optional string reason = 2 [(buf.validate.field).string.max_len = 500];
}

message RevokeKeyResponse {
  KeyInfo key = 1;
}

message UnrevokeKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message UnrevokeKeyResponse {
  KeyInfo key = 1;
}

message DeleteKeyRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Physical delete cascades in one app-level transaction; must be true.
  optional bool confirm = 2;
}

message DeleteKeyResponse {}

message GrantModuleRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  Module module = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  EntitlementKind kind = 3 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  int32 duration_days = 4 [(buf.validate.field).int32 = {
    gte: 1
    lte: 3650
  }];
  google.protobuf.Timestamp expires_at = 5;

  option (buf.validate.message).cel = {
    id: "grant_module.expiry_exclusive"
    message: "exactly one of duration_days or expires_at must be set"
    expression: "(this.duration_days > 0) != has(this.expires_at)"
  };
}

message GrantModuleResponse {
  EntitlementInfo entitlement = 1;
}

message RevokeModuleRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  Module module = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  optional string reason = 3 [(buf.validate.field).string.max_len = 500];
}

message RevokeModuleResponse {}

message ListKeyDevicesRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
}

message ListKeyDevicesResponse {
  repeated DeviceSlotInfo devices = 1;
}

message KickDeviceRequest {
  string key_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  string device_token = 2 [(buf.validate.field).string.uuid = true];
  optional string reason = 3 [(buf.validate.field).string.max_len = 500];
}

message KickDeviceResponse {
  // false = the device was not in a slot.
  bool kicked = 1;
}

message TrialInfo {
  string fingerprint_id = 1;
  Module module = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  string first_device_token = 5; // audit only
}

message ShowTrialRequest {
  string fingerprint_id = 1 [
    (buf.validate.field).string = {
      pattern: "^v1\\.[0-9a-f]{64}$"
      min_len: 1
      max_len: 128
    }
  ];
  // 0/UNSPECIFIED = all modules.
  Module module = 2 [(buf.validate.field).enum.defined_only = true];
}

message ShowTrialResponse {
  repeated TrialInfo trials = 1;
}

message ResetTrialRequest {
  string fingerprint_id = 1 [
    (buf.validate.field).string = {
      pattern: "^v1\\.[0-9a-f]{64}$"
      min_len: 1
      max_len: 128
    }
  ];
  Module module = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  // Mandatory; goes to the audit log.
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
}

message ResetTrialResponse {
  // false = no trial row existed for (fingerprint_id, module).
  bool reset = 1;
}

message ShowPubKeyRequest {}

message ShowPubKeyResponse {
  // base64 of the 32-byte Ed25519 public key derived from the default seed.
  string public_key_b64 = 1;
  // Named (secondary) key, present only during a rotation transition.
  optional string key_id = 2;
  optional string secondary_public_key_b64 = 3;
}

// ─────────────────────────────────────────────────────────────────────────────
// Services
// ─────────────────────────────────────────────────────────────────────────────

// LicenseService is the client-facing activation surface. The google.api.http
// annotations below are the routing contract for the future standalone HTTP
// gateway; this service itself runs gRPC-only.
service LicenseService {
  rpc Ping(google.protobuf.Empty) returns (Pong) {
    option (google.api.http) = {get: "/ping"};
  }

  // Activate is the idempotent converger: first activation, 24h heartbeat,
  // fingerprint rebind, entitlement refresh, and evict-retry all funnel here.
  rpc Activate(ActivateRequest) returns (ActivateResponse) {
    option (google.api.http) = {
      post: "/v1/activate"
      body: "*"
    };
  }

  // Deactivate releases the caller's slot. Idempotent: 200 with
  // released=false when the device was never in a slot.
  rpc Deactivate(DeactivateRequest) returns (DeactivateResponse) {
    option (google.api.http) = {
      post: "/v1/deactivate"
      body: "*"
    };
  }

  // TrialStart starts or resumes a keyless trial by (fingerprint_id, module).
  rpc TrialStart(TrialStartRequest) returns (TrialStartResponse) {
    option (google.api.http) = {
      post: "/v1/trial/start"
      body: "*"
    };
  }

  // Health reports DB reachability and signing-key readiness.
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {get: "/healthz"};
  }
}

// LicenseAdminService is the operator surface (key issuance, entitlement and
// device management, trial resets, pubkey introspection). Every RPC requires
// `Authorization: Bearer <ADMIN_TOKEN>`; the deployment layer additionally
// keeps these paths off the public edge.
service LicenseAdminService {
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse) {
    option (google.api.http) = {
      post: "/v1/admin/keys"
      body: "*"
    };
  }

  rpc ShowKey(ShowKeyRequest) returns (ShowKeyResponse) {
    option (google.api.http) = {get: "/v1/admin/keys/{key_id}"};
  }

  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse) {
    option (google.api.http) = {get: "/v1/admin/keys"};
  }

  rpc UpdateKey(UpdateKeyRequest) returns (UpdateKeyResponse) {
    option (google.api.http) = {
      patch: "/v1/admin/keys/{key_id}"
      body: "*"
    };
  }

  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse) {
    option (google.api.http) = {
      post: "/v1/admin/keys/{key_id}/revoke"
      body: "*"
    };
  }

  rpc UnrevokeKey(UnrevokeKeyRequest) returns (UnrevokeKeyResponse) {
    option (google.api.http) = {
      post: "/v1/admin/keys/{key_id}/unrevoke"
      body: "*"
    };
  }

  rpc DeleteKey(DeleteKeyRequest) returns (DeleteKeyResponse) {
    option (google.api.http) = {delete: "/v1/admin/keys/{key_id}"};
  }

  rpc GrantModule(GrantModuleRequest) returns (GrantModuleResponse) {
    option (google.api.http) = {
      put: "/v1/admin/keys/{key_id}/grants/{module}"
      body: "*"
    };
  }

  rpc RevokeModule(RevokeModuleRequest) returns (RevokeModuleResponse) {
    option (google.api.http) = {delete: "/v1/admin/keys/{key_id}/grants/{module}"};
  }

  rpc ListKeyDevices(ListKeyDevicesRequest) returns (ListKeyDevicesResponse) {
    option (google.api.http) = {get: "/v1/admin/keys/{key_id}/devices"};
  }

  rpc KickDevice(KickDeviceRequest) returns (KickDeviceResponse) {
    option (google.api.http) = {delete: "/v1/admin/keys/{key_id}/devices/{device_token}"};
  }

  rpc ShowTrial(ShowTrialRequest) returns (ShowTrialResponse) {
    option (google.api.http) = {get: "/v1/admin/trials/{fingerprint_id}"};
  }

  rpc ResetTrial(ResetTrialRequest) returns (ResetTrialResponse) {
    option (google.api.http) = {
      post: "/v1/admin/trials/{fingerprint_id}/{module}/reset"
      body: "*"
    };
  }

  rpc ShowPubKey(ShowPubKeyRequest) returns (ShowPubKeyResponse) {
    option (google.api.http) = {get: "/v1/admin/signing/pubkey"};
  }
}
