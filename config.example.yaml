# Structure-only config template. Every value is a ${VAR} placeholder expanded
# by configx (WithExpandEnv) from the process environment at startup; see
# .env.example for the actual values. To override a value, set the env var in
# .env (local) or the container/deployment env — never hard-code values here.
#
# configx loads ./config.yaml (NOT this file). `make run` copies this template
# to config.yaml automatically when missing; for docker, the renderer copies it
# into the image as /app/config.yaml.

server:
  grpc_addr: ${LICENSE_SERVICE_SERVER_GRPC_ADDR}
  http_addr: ${LICENSE_SERVICE_SERVER_HTTP_ADDR}

database:
  driver: ${LICENSE_SERVICE_DATABASE_DRIVER}
  postgres:
    host: ${LICENSE_SERVICE_DATABASE_HOST}
    port: ${LICENSE_SERVICE_DATABASE_PORT}
    user: ${LICENSE_SERVICE_DATABASE_USER}
    password: ${LICENSE_SERVICE_DATABASE_PASSWORD}
    dbname: ${LICENSE_SERVICE_DATABASE_DBNAME}
    sslmode: ${LICENSE_SERVICE_DATABASE_SSLMODE}
  max_open_conns: ${LICENSE_SERVICE_DATABASE_MAX_OPEN_CONNS}
  max_idle_conns: ${LICENSE_SERVICE_DATABASE_MAX_IDLE_CONNS}
  conn_max_lifetime: ${LICENSE_SERVICE_DATABASE_CONN_MAX_LIFETIME}

redis:
  addr: ${LICENSE_SERVICE_REDIS_ADDR}
  username: ${LICENSE_SERVICE_REDIS_USERNAME}
  password: ${LICENSE_SERVICE_REDIS_PASSWORD}
  db: ${LICENSE_SERVICE_REDIS_DB}

# Ed25519 cert-signing keys (design doc §9). The default seed is REQUIRED —
# losing it means every issued cert can never be re-signed. Keep an offline
# copy (password manager / paper). Never commit real seeds.
signing:
  seed: ${LICENSE_SIGNING_SEED}
  # Named keys (rotation / per-build shards). Add entries as needed, each
  # with its own env-expanded values; absent list = default key only:
  #   named:
  #     - key_id: "k2027"
  #       seed: "<64-hex seed>"
  # Which key signs NEW payloads; empty = default. Flip to a named kid only
  # after clients carry that key (rotation cutover).
  sign_key_id: ${LICENSE_SIGNING_SIGN_KEY_ID}

# Keyless trial accounting.
trial:
  days: ${TRIAL_DAYS}

# Per-identity fixed-window rate limiter (go-common ratelimit): at most
# `max` requests per window per (key_hash or fingerprint_id, device_token).
# Anti-abuse guardrail — generous for legit flows (heartbeat is 24h).
rate_limit:
  key_prefix: ${LICENSE_SERVICE_RATE_LIMIT_KEY_PREFIX}
  window: ${LICENSE_SERVICE_RATE_LIMIT_WINDOW}
  max: ${LICENSE_SERVICE_RATE_LIMIT_MAX}

cron:
  timezone: ${LICENSE_SERVICE_CRON_TIMEZONE}

log:
  level: ${LICENSE_SERVICE_LOG_LEVEL}
  format: ${LICENSE_SERVICE_LOG_FORMAT}
