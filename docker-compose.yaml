# Generated by golang-service-docker. Edit the skill inputs and rerender
# instead of hand-merging dependency files.

services:
  license-service:
    image: ${IMAGE_REPOSITORY:-license-service}:${IMAGE_TAG:-latest}
    build:
      context: "."
      dockerfile: "Dockerfile"
      # Override GOPROXY in .env (e.g. GOPROXY=https://goproxy.cn,direct) when
      # proxy.golang.org is unreachable from the build host.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      - LICENSE_SERVICE_SERVER_GRPC_ADDR=${LICENSE_SERVICE_SERVER_GRPC_ADDR:-:19096}
      - LICENSE_SERVICE_SERVER_HTTP_ADDR=${LICENSE_SERVICE_SERVER_HTTP_ADDR:-:18086}
      - LICENSE_SERVICE_LOG_LEVEL=${LICENSE_SERVICE_LOG_LEVEL:-info}
      - LICENSE_SERVICE_DATABASE_HOST=${LICENSE_SERVICE_DATABASE_HOST:-postgres}
      - LICENSE_SERVICE_DATABASE_PORT=${LICENSE_SERVICE_DATABASE_PORT:-5432}
      - LICENSE_SERVICE_DATABASE_USER=${LICENSE_SERVICE_DATABASE_USER:-postgres}
      - LICENSE_SERVICE_DATABASE_PASSWORD=${LICENSE_SERVICE_DATABASE_PASSWORD:-postgres}
      - LICENSE_SERVICE_DATABASE_DBNAME=${LICENSE_SERVICE_DATABASE_DBNAME:-license_service}
      - LICENSE_SERVICE_DATABASE_SSLMODE=${LICENSE_SERVICE_DATABASE_SSLMODE:-disable}
      - LICENSE_SERVICE_REDIS_ADDR=${LICENSE_SERVICE_REDIS_ADDR:-redis:6379}
      - LICENSE_SERVICE_REDIS_USERNAME=${LICENSE_SERVICE_REDIS_USERNAME:-}
      - LICENSE_SERVICE_REDIS_PASSWORD=${LICENSE_SERVICE_REDIS_PASSWORD:-}
      - LICENSE_SERVICE_REDIS_DB=${LICENSE_SERVICE_REDIS_DB:-0}
      - LICENSE_SERVICE_CRON_TIMEZONE=${LICENSE_SERVICE_CRON_TIMEZONE:-Asia/Shanghai}
      - LICENSE_SERVICE_DATABASE_CONN_MAX_LIFETIME=${LICENSE_SERVICE_DATABASE_CONN_MAX_LIFETIME:-5m}
      - LICENSE_SERVICE_DATABASE_DRIVER=${LICENSE_SERVICE_DATABASE_DRIVER:-postgres}
      - LICENSE_SERVICE_DATABASE_MAX_IDLE_CONNS=${LICENSE_SERVICE_DATABASE_MAX_IDLE_CONNS:-10}
      - LICENSE_SERVICE_DATABASE_MAX_OPEN_CONNS=${LICENSE_SERVICE_DATABASE_MAX_OPEN_CONNS:-25}
      - LICENSE_SERVICE_LOG_FORMAT=${LICENSE_SERVICE_LOG_FORMAT:-json}
      - LICENSE_SERVICE_RATE_LIMIT_KEY_PREFIX=${LICENSE_SERVICE_RATE_LIMIT_KEY_PREFIX:-license:rate}
      - LICENSE_SERVICE_RATE_LIMIT_MAX=${LICENSE_SERVICE_RATE_LIMIT_MAX:-10}
      - LICENSE_SERVICE_RATE_LIMIT_WINDOW=${LICENSE_SERVICE_RATE_LIMIT_WINDOW:-60s}
      - LICENSE_SIGNING_SEED=${LICENSE_SIGNING_SEED:-}
      - LICENSE_SIGNING_SIGN_KEY_ID=${LICENSE_SIGNING_SIGN_KEY_ID:-}
      - TRIAL_DAYS=${TRIAL_DAYS:-14}
      - VAR=${VAR:-}
    ports:
      - "${HOST_GRPC_PORT:-19096}:19096"
      - "${HOST_HTTP_PORT:-18086}:18086"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:19096", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      - POSTGRES_DB=${LICENSE_SERVICE_DATABASE_DBNAME:-license_service}
      - POSTGRES_USER=${LICENSE_SERVICE_DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${LICENSE_SERVICE_DATABASE_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LICENSE_SERVICE_DATABASE_USER:-postgres}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}


  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-20}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-3s}

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-license-service-pgdata}
  redisdata:
    name: ${REDIS_VOLUME:-license-service-redisdata}
